<!DOCTYPE html>
<html>
<head>
<title>jQuery Example</title>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
$(document).ready(function(){
    $("#btn").click(function(){
        $("#result").html("Hello from jQuery!");
    });
});
</script>

</head>
<body>

<h2>jQuery Example</h2>

<button id="btn">Click Me</button>

<div id="result"></div>

</body>
</html>
