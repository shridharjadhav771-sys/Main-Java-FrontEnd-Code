<!DOCTYPE html>
<html>
<head>
<title>JavaScript Example</title>

<script>
function showMessage(){
    document.getElementById("result").innerHTML =
        "Hello from JavaScript!";
}
</script>

</head>
<body>

<h2>JavaScript Example</h2>

<button onclick="showMessage()">Click Me</button>

<div id="result"></div>

</body>
</html>
